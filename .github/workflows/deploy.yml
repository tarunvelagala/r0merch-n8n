name: Deploy to n8n

on:
  push:
    branches: [main, feature/multi-workflow-architecture]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow JSON files
        run: |
          echo "Validating workflow JSON..."
          for f in workflows/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" \
              && echo "OK: $f" \
              || { echo "INVALID JSON: $f"; exit 1; }
          done
          echo "All workflow files valid."

      - name: SSH deploy + write .env from secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDDIT_ACCESS_TOKEN: ${{ secrets.REDDIT_ACCESS_TOKEN }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHIPPING_PROFILE_ID: ${{ secrets.ETSY_SHIPPING_PROFILE_ID }}
          AMAZON_SELLER_ID: ${{ secrets.AMAZON_SELLER_ID }}
          AMAZON_ACCESS_TOKEN: ${{ secrets.AMAZON_ACCESS_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "No DEPLOY_HOST set — skipping remote deploy."
            echo "To enable: add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH to GitHub Secrets."
            exit 0
          fi

          # Write SSH key
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Build .env content
          ENV_CONTENT="GEMINI_API_KEY=${GEMINI_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          SERPAPI_KEY=${SERPAPI_KEY}
          HF_TOKEN=${HF_TOKEN}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          REDDIT_ACCESS_TOKEN=${REDDIT_ACCESS_TOKEN}
          REDDIT_USERNAME=${REDDIT_USERNAME}
          GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
          NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
          AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
          ETSY_API_KEY=${ETSY_API_KEY}
          ETSY_SHOP_ID=${ETSY_SHOP_ID}
          ETSY_ACCESS_TOKEN=${ETSY_ACCESS_TOKEN}
          ETSY_SHIPPING_PROFILE_ID=${ETSY_SHIPPING_PROFILE_ID}
          AMAZON_SELLER_ID=${AMAZON_SELLER_ID}
          AMAZON_ACCESS_TOKEN=${AMAZON_ACCESS_TOKEN}"

          # Copy .env to server
          echo "$ENV_CONTENT" | ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cat > ${DEPLOY_PATH}/.env"

          # Pull + restart
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${DEPLOY_PATH} && git pull origin ${{ github.ref_name }} && docker compose down && docker compose up -d"

          echo "Remote deploy complete."
