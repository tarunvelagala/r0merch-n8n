name: Sync n8n Workflows

on:
  push:
    branches:
      - main
      - feature/multi-workflow-architecture
    paths:
      - 'workflows/**'
      - 'workflow.json'
  schedule:
    # Pull from n8n every 30 minutes and commit if changed
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  export-from-n8n:
    name: Export workflows from n8n
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export workflows from n8n
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          API_KEY = os.environ["N8N_API_KEY"]
          BASE = os.environ["N8N_BASE_URL"].rstrip("/")

          workflows = {
              "mHbH68xEHobBorKA": "workflows/pod-design-orchestrator.json",
              "fv5oPTCyTNEmKm7j": "workflows/typography-analyzer-agent.json",
              "hqW3sxjuGwt3UUdB": "workflows/sticker-inspiration-agent.json",
              "RD9bQuDJZFq2Vkqn": "workflows/artwork-generator-agent.json",
          }

          changed = []
          for wf_id, path in workflows.items():
              try:
                  req = urllib.request.Request(
                      f"{BASE}/api/v1/workflows/{wf_id}",
                      headers={"X-N8N-API-KEY": API_KEY}
                  )
                  data = json.loads(urllib.request.urlopen(req).read())
                  new_content = json.dumps(data, indent=2)

                  existing = ""
                  if os.path.exists(path):
                      with open(path) as f:
                          existing = f.read()

                  if new_content != existing:
                      with open(path, "w") as f:
                          f.write(new_content)
                      changed.append(path)
                      print(f"Updated: {path}")
                  else:
                      print(f"No change: {path}")

              except Exception as e:
                  print(f"Failed: {path} — {e}")

          # Also keep workflow.json in sync with orchestrator
          orch_path = "workflows/pod-design-orchestrator.json"
          if os.path.exists(orch_path):
              with open(orch_path) as f:
                  content = f.read()
              with open("workflow.json") as f:
                  existing = f.read()
              if content != existing:
                  with open("workflow.json", "w") as f:
                      f.write(content)
                  changed.append("workflow.json")

          with open(os.environ.get("GITHUB_ENV", "/dev/null"), "a") as f:
              f.write(f"CHANGED={'true' if changed else 'false'}\n")
          PYEOF

      - name: Commit and push if changed
        if: env.CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflows/ workflow.json
          git commit -m "chore: sync workflows from n8n [skip ci]"
          git push

  import-to-n8n:
    name: Import workflows to n8n
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Import changed workflows to n8n
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, os

          API_KEY = os.environ["N8N_API_KEY"]
          BASE = os.environ["N8N_BASE_URL"].rstrip("/")

          workflows = {
              "mHbH68xEHobBorKA": "workflows/pod-design-orchestrator.json",
              "fv5oPTCyTNEmKm7j": "workflows/typography-analyzer-agent.json",
              "hqW3sxjuGwt3UUdB": "workflows/sticker-inspiration-agent.json",
              "RD9bQuDJZFq2Vkqn": "workflows/artwork-generator-agent.json",
          }

          for wf_id, path in workflows.items():
              if not os.path.exists(path):
                  print(f"Skipping {path} — not found")
                  continue
              try:
                  with open(path) as f:
                      wf = json.load(f)

                  # Strip read-only fields
                  for field in ["id", "updatedAt", "active", "tags"]:
                      wf.pop(field, None)

                  data = json.dumps(wf).encode()
                  req = urllib.request.Request(
                      f"{BASE}/api/v1/workflows/{wf_id}",
                      data=data,
                      method="PUT",
                      headers={
                          "X-N8N-API-KEY": API_KEY,
                          "Content-Type": "application/json"
                      }
                  )
                  result = json.loads(urllib.request.urlopen(req).read())
                  print(f"Imported: {result.get('name')} ({path})")

              except Exception as e:
                  print(f"Failed: {path} — {e}")
          PYEOF
