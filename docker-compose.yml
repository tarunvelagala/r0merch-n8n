services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - /Users/C5404787/n8n/data:/home/node/.n8n
      - /Users/C5404787/n8n/files:/home/node/.n8n-files
      - ./workflows:/workflows
      - ./workflow.json:/workflow.json:ro
      - ./docker-entrypoint.sh:/r0merch-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/r0merch-entrypoint.sh"]
    env_file:
      - .env
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "admin"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      N8N_ALLOWED_ENV_VARS: "PINTEREST_ACCESS_TOKEN,GEMINI_API_KEY,OPENAI_API_KEY,GROQ_API_KEY,SERPAPI_KEY,HF_TOKEN,REDDIT_ACCESS_TOKEN,REDDIT_USERNAME,GOOGLE_SHEET_ID,NOTION_DATABASE_ID,AIRTABLE_BASE_ID,ETSY_API_KEY,ETSY_SHOP_ID,ETSY_ACCESS_TOKEN,ETSY_SHIPPING_PROFILE_ID,AMAZON_SELLER_ID,AMAZON_ACCESS_TOKEN"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Expose secrets to n8n expressions via $env.KEY
      PINTEREST_ACCESS_TOKEN: "${PINTEREST_ACCESS_TOKEN}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      SERPAPI_KEY: "${SERPAPI_KEY}"
      HF_TOKEN: "${HF_TOKEN}"
      REDDIT_ACCESS_TOKEN: "${REDDIT_ACCESS_TOKEN}"
      REDDIT_USERNAME: "${REDDIT_USERNAME}"
      GOOGLE_SHEET_ID: "${GOOGLE_SHEET_ID}"
      NOTION_DATABASE_ID: "${NOTION_DATABASE_ID}"
      AIRTABLE_BASE_ID: "${AIRTABLE_BASE_ID}"
      ETSY_API_KEY: "${ETSY_API_KEY}"
      ETSY_SHOP_ID: "${ETSY_SHOP_ID}"
      ETSY_ACCESS_TOKEN: "${ETSY_ACCESS_TOKEN}"
      ETSY_SHIPPING_PROFILE_ID: "${ETSY_SHIPPING_PROFILE_ID}"
      AMAZON_SELLER_ID: "${AMAZON_SELLER_ID}"
      AMAZON_ACCESS_TOKEN: "${AMAZON_ACCESS_TOKEN}"
